<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow chatbot-container">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="bi bi-robot fs-3 me-2"></i>
                    <h2 class="mb-0 fs-4">Chatbot</h2>
                </div>
                <div class="card-body chat-window bg-light" id="chat-window" style="height: 350px; overflow-y: auto;">
                    <ng-container *ngIf="messages && messages.length; else noMessages">
                        <div *ngFor="let msg of messages">
                            <div [ngClass]="{'text-end': msg.sender === 'user', 'text-start': msg.sender === 'ai'}">
                                <span class="badge bg-secondary" *ngIf="msg.sender === 'ai'">AI:</span>
                                <span class="badge bg-primary" *ngIf="msg.sender === 'user'">You:</span>
                                <span>{{ msg.text }}</span>
                            </div>
                        </div>
                    </ng-container>
                    <ng-template #noMessages>
                        <div class="text-muted text-center mt-5">No conversation yet.</div>
                    </ng-template>
                </div>
                <form (ngSubmit)="sendMessage()" class="card-footer bg-white chat-form d-flex align-items-center gap-2">
                    <input
                        type="text"
                        [(ngModel)]="userInput"
                        name="userInput"
                        class="form-control"
                        placeholder="Type your message..."
                        required
                        autocomplete="off"
                        ngModel
                    />
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> Send
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
