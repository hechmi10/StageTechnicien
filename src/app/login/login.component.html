<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">SysHR Login</h3>
      <form [formGroup]="login_form" (ngSubmit)="onLogin(login_form)">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            formControlName="email"
            class="form-control"
            placeholder="Enter your email"
            type="email"
            [ngClass]="{'is-invalid': login_form.get('email')?.invalid && login_form.get('email')?.touched}"
          >
          <div *ngIf="login_form.get('email')?.invalid && login_form.get('email')?.touched" class="invalid-feedback">
            <small *ngIf="login_form.get('email')?.errors?.['required']">Email is required.</small>
            <small *ngIf="login_form.get('email')?.errors?.['email']">Please enter a valid email address.</small>
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            formControlName="password"
            class="form-control"
            placeholder="Enter your password"
            type="password"
            [ngClass]="{'is-invalid': login_form.get('password')?.invalid && login_form.get('password')?.touched}"
          >
          <div *ngIf="login_form.get('password')?.invalid && login_form.get('password')?.touched" class="invalid-feedback">
            <small *ngIf="login_form.get('password')?.errors?.['required']">Password is required.</small>
            <small *ngIf="login_form.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</small>
          </div>
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary" [disabled]="login_form.invalid">Login</button>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>
      </form>
      <div class="text-center">
          <a routerLink="/register" class="text-decoration-none">Don't have an account? Register here</a>
      </div>
    </div>
  </div>
</div>
