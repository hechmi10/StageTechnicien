<!-- Show navbar only when authenticated -->
<div *ngIf="isAuthenticated()">
    <nav class="navbar navbar-expand-lg" [ngClass]="isAdmin() ? 'navbar-dark bg-dark' : 'navbar-primary bg-primary'">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SysHR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <ng-container *ngIf="isAdmin()">
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/gestion-retard">Gestion des Retards</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/gestion-autorisation">Gestion des Autorisations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/gestion-conge">Gestion des Congés</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/gestion-evaluation">Gestion des Evaluations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/gestion-absence">Gestion des Absences</a>
                        </li>
                    </ng-container>
                    <ng-container *ngIf="!isAdmin()">
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/pointage">Pointage</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" (click)="openCreateCongeModal()">Demander un congé</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" (click)="openCreateAutorisationModal()">Demander une autorisation</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/chatbot">Chatbot</a>
                    </ng-container>
                    <li class="nav-item">
                        <a class="nav-link" (click)="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<div class="modal" tabindex="-1" [ngClass]="{'show d-block': showCreateCongeModal}">
    <div class="modal-dialog">
        <div class="modal-content">
            <form (ngSubmit)="createConge()">
                <div class="modal-header">
                    <h5 class="modal-title">Créer un Congé</h5>
                    <button type="button" class="btn-close" (click)="closeCreateCongeModal()"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Employé</label>
                        <select class="form-control" [(ngModel)]="newConge.employe" name="employe" required>
                            <option [ngValue]="null" disabled>Sélectionner un employé</option>
                            <option *ngFor="let emp of employees" [value]="emp.email">
                                <div *ngIf="emp.role === 'EMPLOYEE'">
                                    {{ emp.email }}
                                </div>
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Date Début</label>
                        <input type="date" class="form-control" [(ngModel)]="newConge.dateDebut" name="dateDebut"
                            required>
                    </div>
                    <div class="mb-3">
                        <label>Date Fin</label>
                        <input type="date" class="form-control" [(ngModel)]="newConge.dateFin" name="dateFin" required>
                    </div>
                    <div class="mb-3">
                        <label>Nombre de jours</label>
                        <input type="number" class="form-control" [(ngModel)]="newConge.nbJours" name="nbJours" required
                            readonly [value]="dateDiff(newConge.dateDebut, newConge.dateFin)">
                    </div>
                    <div class="mb-3">
                        <label>Raison</label>
                        <input type="text" class="form-control" [(ngModel)]="newConge.raison" name="raison" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="closeCreateCongeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal" tabindex="-1" [ngClass]="{'show d-block': showCreateAutorisationModal}">
        <div class="modal-dialog">
            <div class="modal-content">
                <form [formGroup]="createAutorisationForm" (ngSubmit)="createAutorisation()">
                    <div class="modal-header">
                        <h5 class="modal-title">Create Autorisation</h5>
                        <button type="button" class="btn-close" (click)="closeCreateAutorisationModal()"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="employee">Employee</label>
                            <select id="employee" class="form-control" formControlName="employee" required>
                                <option [ngValue]="null" disabled>Select an employee</option>
                                <option *ngFor="let emp of employees" [ngValue]="emp.email">
                                    <div *ngIf="emp.role === 'EMPLOYEE'">
                                        {{ emp.email }}
                                    </div>
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="dateAutorisation">Date Autorisation</label>
                            <input id="dateAutorisation" type="date" class="form-control"
                                formControlName="dateAutorisation" required>
                        </div>
                        <div class="mb-3">
                            <label for="duration">Duration</label>
                            <input id="duration" type="text" class="form-control" formControlName="duration" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success"
                            [disabled]="createAutorisationForm.invalid">Create</button>
                        <button type="button" class="btn btn-secondary" (click)="closeCreateAutorisationModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
